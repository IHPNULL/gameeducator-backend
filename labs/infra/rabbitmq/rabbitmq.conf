# RabbitMQ do lab B1 (Desafios 4 e 5). Topologia versionada em definitions.json (nao criada pelo codigo).
load_definitions = /etc/rabbitmq/definitions.json
loopback_users = none

# Desafio 5: MQTT no MESMO broker (sem segundo broker). Publicacoes MQTT caem no exchange amq.topic,
# com "/" do topico convertido em "." na routing key.
mqtt.allow_anonymous = false
mqtt.vhost = /
mqtt.exchange = amq.topic

# Desafio 6: metricas por fila (rabbitmq_queue_messages_ready{queue=...}) para o Prometheus
prometheus.return_per_object_metrics = true
