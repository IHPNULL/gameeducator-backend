# Prometheus do lab B1 (Desafio 6). Intervalo curto (5s) porque o lab provoca falhas em segundos.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
  - job_name: ia
    metrics_path: /metrics/
    static_configs:
      - targets: ["ia:8000"]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: notificacao
    metrics_path: /metrics
    static_configs:
      - targets: ["notificacao:8085"]
