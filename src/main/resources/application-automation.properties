# Perfil "automation": banco H2 em memoria, recriado do zero a cada start e
# populado com um cenario fixo (ver config/AutomationSeedData.java).
# Usado pela suite de automacao Cucumber (pasta automation/ na raiz do repo)
# para nunca rodar contra dados reais/producao.
spring.datasource.url=jdbc:h2:mem:automation;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173,http://localhost:8081
