spring.application.name=grupo_6_gameeducator

# Perfil padrao (usado em dev e nos testes): banco em memoria H2.
# Para persistencia real, ative o perfil "postgres"
# (SPRING_PROFILES_ACTIVE=postgres) - veja application-postgres.properties.
# Banco em memoria (H2) para desenvolvimento e testes
spring.datasource.url=jdbc:h2:mem:gameeducator;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CORS: origens do frontend em dev permitidas a chamar /api/**
# 5173 = npm run dev (Vite), 4173 = npm run preview
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# ---- B1 (docs/arquitetura) ----
# Desafio 2: marcos de medalha configuraveis; adaptador de persistencia da gamificacao (jpa | memoria)
app.gamificacao.marcos-xp=50,100,250,500
app.gamificacao.persistencia=jpa

# Desafio 3: servico de IA (FastAPI). Timeouts curtos + disjuntor: IA fora nao pode travar o Core.
app.ia.url=${IA_URL:http://localhost:8000}
app.ia.timeout-conexao=300ms
app.ia.timeout-leitura=2s
app.ia.disjuntor.limite-falhas=3
app.ia.disjuntor.espera=15s

# Desafio 4: eventos. assincrono = outbox + relay (padrao) | sincrono = REST direto (so para o lab)
app.eventos.modo=${EVENTOS_MODO:assincrono}
app.eventos.exchange=gameeducator.eventos
app.eventos.relay.habilitado=${EVENTOS_RELAY:false}
app.eventos.relay.intervalo=2s
app.notificacao.url=${NOTIFICACAO_URL:http://localhost:8085}
# Desafios 4 e 5: RabbitMQ (com plugin MQTT). Desligado por padrao: dev e testes rodam sem broker.
app.mensageria.habilitada=${MENSAGERIA_HABILITADA:false}
app.iot.fila=core.iot.eventos
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:gameeducator}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:gameeducator}
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=20
management.health.rabbit.enabled=${app.mensageria.habilitada}

# Desafio 6: observabilidade (Prometheus em /actuator/prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=gameeducator-core
management.metrics.distribution.percentiles-histogram.http.server.requests=true
