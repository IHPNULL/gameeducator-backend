# Perfil "postgres": banco PostgreSQL persistente (uso em Docker/producao local).
# Ativar com SPRING_PROFILES_ACTIVE=postgres (combina com "dev" para dados de exemplo).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gameeducator}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:gameeducator}
spring.datasource.password=${DB_PASSWORD:gameeducator}

# Mesma estrategia de schema do perfil H2 (sem Flyway/Liquibase): adequado
# para o escopo academico deste projeto, nao recomendado em producao real.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
